name: CI

on:
  pull_request:

# A new push to a pull request supersedes its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only docs/** and *.md files skip verify and
  # flare; ci-ok still reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          printf '%s\n' "$changed"
          if grep -qvE '^docs/|\.md$' <<<"$changed"; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh
      - run: git diff --check
      # Muntin's own checks must not need Flare: only the default
      # environment was installed above.
      - name: default checks ran without the flare environment
        run: test ! -e .pixi/envs/flare

  flare:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: runner image
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          uname -a
          if [ -r /etc/os-release ]; then cat /etc/os-release; else sw_vers; fi
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          environments: default flare
          # Always build the flare env from the lock: a restored cache would
          # skip the pixi-build compile this job exists to prove.
          cache: false
      - run: ./scripts/check_flare.sh

  # The one required status check for main. It must fail, never skip, when
  # anything above fails or is cancelled: a skipped required check counts as
  # passing.
  ci-ok:
    needs: [changes, verify, flare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          VERIFY: ${{ needs.verify.result }}
          FLARE: ${{ needs.flare.result }}
        run: |
          echo "changes=$CHANGES code=$CODE verify=$VERIFY flare=$FLARE"
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then want=success; else want=skipped; fi
          test "$VERIFY" = "$want"
          test "$FLARE" = "$want"
