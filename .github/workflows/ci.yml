name: CI

on:
  pull_request:

# A new push to a pull request supersedes its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only docs/** and *.md files skip verify and
  # flare; docs and ci-ok still run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # --no-renames: a rename out of src/ into docs/ must count as code.
          changed="$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD")"
          printf '%s\n' "$changed"
          if grep -qvE '^docs/|\.md$' <<<"$changed"; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  # The documents' checks need only Python, so every pull request runs
  # them, those that change only documents included.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check_docs.sh

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: verify (${{ matrix.os }}, ${{ matrix.task.label }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # check.sh and test.sh share nothing, so they run as separate jobs.
        # The fixture builds are most of check.sh: each check job builds one
        # shard of them (CHECK_SHARD in scripts/check.sh). label only names
        # the job.
        task:
          - { label: check 1/2, script: check, shard: 1/2 }
          - { label: check 2/2, script: check, shard: 2/2 }
          - { label: test, script: test, shard: "" }
        # test.sh under AddressSanitizer (SANITIZE in scripts/test.sh), then
        # the known gaps that must still report (scripts/run_origin_gaps.sh).
        # Linux only: leak detection is verified there alone.
        include:
          - os: ubuntu-latest
            task: { label: test asan, script: test, shard: "", sanitize: address }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Mojo's compile cache below is per target CPU, which defaults to this one.
      - name: runner CPU
        run: grep -m1 'model name' /proc/cpuinfo 2>/dev/null || sysctl -n machdep.cpu.brand_string
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          locked: true
      # Mojo's compile cache, which no pixi cache holds. Its entries are
      # keyed by content, so a stale one is a miss, not a wrong build. A
      # pull request can restore only its own runs' saves (and main's).
      - uses: actions/cache@v6
        with:
          path: .pixi/envs/default/share/max/cache/.mojo_cache
          key: mojo-${{ runner.os }}-${{ matrix.task.script }}${{ matrix.task.shard }}${{ matrix.task.sanitize }}-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mojo-${{ runner.os }}-${{ matrix.task.script }}${{ matrix.task.shard }}${{ matrix.task.sanitize }}-${{ hashFiles('pixi.lock') }}-
      - env:
          CHECK_SHARD: ${{ matrix.task.shard }}
          SANITIZE: ${{ matrix.task.sanitize }}
        run: ./scripts/${{ matrix.task.script }}.sh
      - if: matrix.task.sanitize == 'address'
        run: ./scripts/run_origin_gaps.sh
      - if: matrix.task.script == 'check'
        run: git diff --check
      # Muntin's own checks must not need Flare: only the default
      # environment was installed above.
      - name: default checks ran without the flare environment
        run: test ! -e .pixi/envs/flare

  flare:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: runner image
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          uname -a
          if [ -r /etc/os-release ]; then cat /etc/os-release; else sw_vers; fi
          # Mojo's compile cache is per target CPU, which defaults to this one.
          grep -m1 'model name' /proc/cpuinfo 2>/dev/null || sysctl -n machdep.cpu.brand_string
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          locked: true
          environments: default flare
          # Always build the flare env from the lock: a restored cache would
          # skip the pixi-build compile this job exists to prove.
          cache: false
      # Only Mojo's compile cache (see verify); the environments above are
      # still built from the lock.
      - uses: actions/cache@v6
        with:
          path: |
            .pixi/envs/default/share/max/cache/.mojo_cache
            .pixi/envs/flare/share/max/cache/.mojo_cache
          key: mojo-${{ runner.os }}-flare-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mojo-${{ runner.os }}-flare-${{ hashFiles('pixi.lock') }}-
      - run: ./scripts/check_flare.sh

  # The one required status check for main. It must fail, never skip, when
  # anything above fails or is cancelled: a skipped required check counts as
  # passing.
  ci-ok:
    needs: [changes, docs, verify, flare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          CODE: ${{ needs.changes.outputs.code }}
          VERIFY: ${{ needs.verify.result }}
          FLARE: ${{ needs.flare.result }}
        run: |
          echo "changes=$CHANGES docs=$DOCS code=$CODE verify=$VERIFY flare=$FLARE"
          test "$CHANGES" = success
          test "$DOCS" = success
          if [ "$CODE" = true ]; then want=success; else want=skipped; fi
          test "$VERIFY" = "$want"
          test "$FLARE" = "$want"
